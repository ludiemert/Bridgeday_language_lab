<!-- This is the BridgeDay browser icon. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
>
  <!-- This is the purple background. -->
  <rect
    width="64"
    height="64"
    rx="16"
    fill="#7C3AED"
  />

  <!-- This is the lime circle. -->
  <circle
    cx="49"
    cy="15"
    r="7"
    fill="#C6FF3C"
  />

  <!-- This is the BridgeDay letter. -->
  <text
    x="32"
    y="45"
    fill="#FFFFFF"
    font-family="Arial, sans-serif"
    font-size="38"
    font-weight="700"
    text-anchor="middle"
  >
    B
  </text>
</svg>